[package]
name = "openetude"
version = "0.1.0"
edition = "2021"
description = "Learn to play the piano with a MIDI keyboard, MusicXML lessons and a falling-notes view"
homepage = "https://openetude.org"

[dependencies]
# GL 2.1 / GLES 2.0 renderer: runs on very old GPUs and on ARM boards
macroquad = { version = "0.4", default-features = false }
# SoundFont (SF2) synthesizer, pure Rust
rustysynth = "1.3"
cpal = "0.18"
midir = "0.11"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sys-locale = "0.3"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
rust-embed = "8.14.0"
unic-langid = "0.9.6"

[profile.release]
lto = "thin"
opt-level = 3

# The synthesizer is far too slow without optimizations, even while developing.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
